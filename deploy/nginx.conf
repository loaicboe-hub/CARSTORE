# Nginx Configuration for CAR IN / AUTOHAUS on Hostinger VPS
# Place in: /etc/nginx/sites-available/carstore and symlink to /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name _; # Replace with your domain name (e.g. carin.com www.carin.com) or VPS IP

    # Allow photo uploads up to 15MB
    client_max_body_size 15M;

    # Serve built React frontend (SPA)
    location / {
        root /var/www/carstore/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API endpoints to Node.js / Express backend
    location /api/ {
        proxy_pass http://127.0.0.1:5001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Serve uploaded car photos directly from disk
    location /uploads/ {
        alias /var/www/carstore/public/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
